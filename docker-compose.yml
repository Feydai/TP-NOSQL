services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb_bibliotheque
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root123
    volumes:
      - mongodb_exercice1_data:/data/db
      - ./:/scripts
    ports:
      - "27017:27017"

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8080:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://root:root123@mongodb:27017/?authSource=admin
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongodb

volumes:
  mongodb_exercice1_data:
    driver: local